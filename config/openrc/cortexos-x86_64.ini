# Meson cross file template for a future CortexOS OpenRC toolchain.
#
# This file deliberately names the toolchain commands instead of pointing at
# the host compiler. A host Linux binary is not a CortexOS user binary and
# must never be installed in the rootfs. Set CORTEXOS_TOOLCHAIN_DIR (or edit
# the generated copy) when the CortexOS libc/toolchain is available.

[binaries]
c = 'x86_64-cortexos-gcc'
cpp = 'x86_64-cortexos-g++'
ar = 'x86_64-cortexos-ar'
strip = 'x86_64-cortexos-strip'

[host_machine]
system = 'cortexos'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
# The toolchain must provide a sysroot containing the CortexOS libc headers
# and static archive. Meson will reject this file until that sysroot exists.
sys_root = '/opt/cortexos/sysroot'
needs_exe_wrapper = true

[project options]
audit = 'disabled'
pam = false
selinux = 'disabled'
bash-completions = false
zsh-completions = false
newnet = false
pkgconfig = false
