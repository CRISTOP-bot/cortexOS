name: NucleOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nucleos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel and bootable ISO
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build and emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils \
            gcc \
            grub-common \
            grub-pc-bin \
            make \
            mtools \
            qemu-system-x86 \
            xorriso

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Validate Bash submodule
        run: make bash-source

      - name: Build kernel
        run: |
          make clean
          make -j"$(nproc)"
          test -s build/kernel.bin

      - name: Validate Multiboot kernel
        run: grub-file --is-x86-multiboot build/kernel.bin

      - name: Build bootable ISO
        run: |
          make PYTHON=python3 echo-iso
          test -s os.iso
          test -s iso/boot/kernel.bin
          test -s iso/boot/rootfs.bin
          sha256sum os.iso > SHA256SUMS

      - name: Boot smoke test in QEMU
        shell: bash
        run: |
          set +e
          timeout --foreground 30s \
            qemu-system-x86_64 \
              -cdrom os.iso \
              -m 512M \
              -display none \
              -serial file:qemu-serial.log \
              -no-reboot \
              -no-shutdown
          qemu_status=$?
          set -e

          # The kernel is intentionally long-running, so timeout(124) is expected.
          if [ "$qemu_status" -ne 0 ] && [ "$qemu_status" -ne 124 ]; then
            echo "QEMU terminó con un estado inesperado: $qemu_status"
            cat qemu-serial.log || true
            exit "$qemu_status"
          fi

          grep -aF '[Rust] NucleOS Rust kernel module loaded' qemu-serial.log

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nucleos-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            os.iso
            SHA256SUMS
            build/kernel.bin
            iso/boot/rootfs.bin
            qemu-serial.log

  release:
    name: Create GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nucleos-${{ github.sha }}
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nucleos-${{ github.run_number }}
          name: NucleOS build ${{ github.run_number }}
          generate_release_notes: true
          body: |
            Release automático generado después de un cambio en `main`.

            Commit: `${{ github.sha }}`
          files: |
            release/os.iso
            release/SHA256SUMS
