name: NucleOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nucleos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel and bootable ISO
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build and emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils \
            gcc \
            grub-common \
            grub-pc-bin \
            make \
            mtools \
            qemu-system-x86 \
            xorriso

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Validate Bash submodule
        run: make bash-source

      - name: Validate Fastfetch submodule
        run: make fastfetch-source

      - name: Validate architecture matrix
        run: make arch-list

      - name: Build kernel
        run: |
          make ARCH=x86_64 clean
          make -j"$(nproc)"
          test -s build/kernel.bin

      - name: Validate Multiboot kernel
        run: grub-file --is-x86-multiboot build/kernel.bin

      - name: Build bootable ISO
        run: |
          make PYTHON=python3 echo-iso
          test -s dist/os.iso
          test -s build/iso/boot/kernel.bin
          test -s build/iso/boot/rootfs.bin
          sha256sum dist/os.iso > SHA256SUMS

      - name: Boot smoke test in QEMU
        id: qemu-smoke
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout --foreground 35s \
            qemu-system-x86_64 \
              -cdrom dist/os.iso \
              -m 512M \
              -display none \
              -serial file:qemu-serial.log \
              -monitor none \
              -no-reboot \
              -no-shutdown \
              -d guest_errors,unimp,pcall,cpu_reset \
              -D qemu-debug.log
          qemu_status=$?
          set -e

          # El kernel todavía no tiene una instrucción de salida para QEMU y
          # está diseñado para seguir ejecutándose; timeout(124) es normal.
          if [ "$qemu_status" -ne 0 ] && [ "$qemu_status" -ne 124 ]; then
            echo "QEMU terminó con un estado inesperado: $qemu_status"
            exit "$qemu_status"
          fi

          if grep -aFq '[Rust] NucleOS Rust kernel module loaded' qemu-serial.log; then
            echo 'Marcador de arranque encontrado en COM1.'
          else
            echo 'Aviso: no apareció el marcador serial; se conservan los logs para diagnóstico.'
            exit 1
          fi

      - name: Report QEMU smoke-test diagnostics
        if: steps.qemu-smoke.outcome == 'failure'
        shell: bash
        run: |
          echo 'La ISO se compiló, pero el smoke test no confirmó el marcador serial.'
          echo '--- qemu-serial.log ---'
          cat qemu-serial.log 2>/dev/null || true
          echo '--- últimos eventos de QEMU ---'
          tail -80 qemu-debug.log 2>/dev/null || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nucleos-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/os.iso
            SHA256SUMS
            build/kernel.bin
            build/iso/boot/rootfs.bin
            qemu-serial.log
            qemu-debug.log

  release:
    name: Create GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nucleos-${{ github.sha }}
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nucleos-${{ github.run_number }}
          name: NucleOS build ${{ github.run_number }}
          generate_release_notes: true
          body: |
            Release automático generado después de un cambio en `main`.

            Commit: `${{ github.sha }}`
          files: |
            release/dist/os.iso
            release/SHA256SUMS
