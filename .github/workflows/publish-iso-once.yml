name: Publish NucleOS ISO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish experimental ISO
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout NucleOS
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: 3b7cac2f7bbf98bbfd0a3f9821ced19d8abf1c38

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils gcc grub-common grub-pc-bin make mtools xorriso

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build ISO
        run: |
          make clean
          make -j"$(nproc)"
          make PYTHON=python3 echo-iso
          test -s os.iso
          sha256sum os.iso > SHA256SUMS

      - name: Upload ISO to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nucleos-2026.08.11-test
          name: NucleOS 2026.08.11 — ISO de prueba
          prerelease: true
          files: |
            os.iso
            SHA256SUMS
